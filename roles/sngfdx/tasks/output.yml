- name: Add new hashes to md5sum.txt
  ansible.builtin.lineinfile:
    path: "{{ dextract.path }}/md5sum.txt"
    line: "{{ item.stat.checksum }} {{ item.stat.path }}"
  loop: "{{ newhashes.results }}"

