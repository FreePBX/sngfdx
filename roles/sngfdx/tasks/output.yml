- name: Remove old file hashes from md5sum.txt
  ansible.builtin.lineinfile:
    path: "{{ dextract.path }}/md5sum.txt"
    regexp: "{{ item | regex_escape() }}$"
    state: absent
  loop:
    - "./isolinux/menu.cfg"
    - "./isolinux/splash.png"
    - "./boot/grub/grub.cfg"
    - "./boot/grub/theme/1"
    - "./.disk/info"
    - "./README.txt"

