- name: Run xorriso to generate ISO output.
  ignore_errors: true
  environment:
    SOURCE_DATE_EPOCH: "{{ str_script_source_date_epoch }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/xorriso
      - -indev
      -   "{{ fn_iso_input }}"
      - -outdev
      -   "{{ fn_iso_output }}"
      - -pathspecs
      -   "off"
      - -disk_pattern
      -   "on"
      - "{{ (dir_deb_files == '') | ternary('', '-map_l') }}"
      - "{{ (dir_deb_files == '') | ternary('', dir_deb_files) }}"
      - "{{ (dir_deb_files == '') | ternary('', '/packages-sngfd') }}"
      - "{{ (dir_deb_files == '') | ternary('', dir_deb_files ~ '/*.deb') }}"
      - "{{ (dir_deb_files == '') | ternary('', '--') }}"
      - -map_l
      -   "{{ dextract.path }}/linux"
      -   "/pool/main/l/linux"
      -   "{{ dextract.path }}/linux/*.deb"
      - --
      - -map_l
      -   "{{ dextract.path }}/linux-signed-amd64"
      -   "/pool/main/l/linux-signed-amd64"
      -   "{{ dextract.path }}/linux-signed-amd64/*.deb"
      - --
      - -map_l
      -   "{{ dextract.path }}/linux-signed-amd64"
      -   "/pool/main/l/linux-signed-amd64"
      -   "{{ dextract.path }}/linux-signed-amd64/*.udeb"
      - --
      - -map
